<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Live Chat — Mitra Payment</title><style>body{margin:0;background:#f5f6fa;font:14px Arial;color:#202735}.wrap{max-width:900px;margin:28px auto;padding:16px}.card{background:#fff;border:1px solid #e8ebf1;border-radius:14px;padding:16px;margin-bottom:12px}.row{display:flex;gap:8px}input,button,textarea{font:inherit;padding:11px;border:1px solid #dce1e9;border-radius:9px}button{background:#ed1c2e;color:white;border:0;font-weight:bold}#chats{display:grid;grid-template-columns:1fr 2fr;gap:12px}.list button{display:block;width:100%;margin:6px 0;text-align:left;background:#fff;color:#202735;border:1px solid #e5e8ef}.msgs{height:360px;overflow:auto;background:#f7f8fb;padding:12px;border-radius:10px}.bubble{background:white;padding:9px;border-radius:10px;margin:7px 0;max-width:85%}.admin{margin-left:auto;background:#ffecef}.send{display:flex;gap:8px;margin-top:10px}.send input{flex:1}@media(max-width:650px){#chats{grid-template-columns:1fr}}</style><div class="wrap"><h2>Admin Live Chat</h2><div class="card row"><input id="token" type="password" placeholder="CHAT_ADMIN_TOKEN" style="flex:1"><button id="connect">Masuk</button></div><div id="chats" hidden><div class="card list" id="list">Pilih percakapan</div><div class="card"><b id="title">Percakapan</b><div class="msgs" id="msgs"></div><form class="send" id="send"><input id="reply" placeholder="Tulis balasan…" required><button>Kirim</button></form></div></div><p id="status"></p></div><script>let token='',selected='';const $=x=>document.getElementById(x);async function load(){let r=await fetch('/api/admin',{headers:{authorization:'Bearer '+token}});let j=await r.json();if(!r.ok)throw Error(j.error);$('list').innerHTML='';j.chats.forEach(c=>{let b=document.createElement('button');b.textContent=(c.messages[0]?.name||'Pengunjung')+' · '+c.messages.length+' pesan';b.onclick=()=>{selected=c.chatId;$('title').textContent='Chat '+selected.slice(0,10);show(c.messages)};$('list').appendChild(b)});if(selected){let c=j.chats.find(x=>x.chatId===selected);if(c)show(c.messages)}}function show(rows){$('msgs').innerHTML='';rows.forEach(m=>{let d=document.createElement('div');d.className='bubble '+(m.from==='admin'?'admin':'');d.textContent=(m.from==='admin'?'Admin: ':'Pengunjung: ')+m.text;$('msgs').appendChild(d)});$('msgs').scrollTop=$('msgs').scrollHeight}$('connect').onclick=async()=>{token=$('token').value;try{await load();$('chats').hidden=false;$('status').textContent='Terhubung';setInterval(()=>load().catch(e=>$('status').textContent=e.message),4000)}catch(e){$('status').textContent=e.message}};$('send').onsubmit=async e=>{e.preventDefault();if(!selected)return;let r=await fetch('/api/admin',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({chatId:selected,text:$('reply').value})});let j=await r.json();if(!r.ok){$('status').textContent=j.error;return}$('reply').value='';await load()};</script></html>
